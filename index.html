  :root{
    --navy-950:#0F1832;
    --navy-900:#1B2A54;
    --navy-800:#243768;
    --navy-700:#33477F;
    --gold-600:#C0902F;
    --gold-500:#DDA83E;
    --gold-400:#E9C365;
    --gold-100:#FBEED2;
    --cream:#FFFBF3;
    --white:#FFFFFF;
    --ink:var(--navy-900);
    --ink-soft:rgba(27,42,84,.6);
    --shadow-1: 0 1px 2px rgba(15,24,50,.06), 0 1px 1px rgba(15,24,50,.04);
    --shadow-2: 0 10px 30px -12px rgba(15,24,50,.35);
    --nav-h: 58px;
    --font-display:'Thmanyah Sans','Noto Kufi Arabic',system-ui,sans-serif;
    --font-body:'Thmanyah Sans','Noto Sans Arabic',system-ui,sans-serif;
  }

  *{box-sizing:border-box;}
  html{scroll-behavior:smooth; scroll-padding-top: calc(var(--nav-h) + 14px);}
  @media (prefers-reduced-motion: reduce){
    html{scroll-behavior:auto;}
    *{animation-duration:.001ms !important; animation-iteration-count:1 !important; transition-duration:.001ms !important;}
  }
  body{
    margin:0;
    background:var(--cream);
    color:var(--ink);
    font-family:var(--font-body);
    -webkit-font-smoothing:antialiased;
    text-wrap:pretty;
  }
  img{max-width:100%; display:block;}
  button{font-family:inherit;}
  ::selection{background:var(--gold-400); color:var(--navy-900);}

  :focus-visible{outline:3px solid var(--gold-500); outline-offset:2px; border-radius:4px;}

  /* ---------- HERO ---------- */
  .hero{
    position:relative;
    background:
      radial-gradient(120% 140% at 50% -20%, var(--navy-700) 0%, var(--navy-900) 55%, var(--navy-950) 100%);
    color:var(--white);
    padding: 30px 20px 26px;
    text-align:center;
    overflow:hidden;
  }
  .hero::before{
    content:"";
    position:absolute; inset:0;
    background-image:
      radial-gradient(circle at 15% 20%, rgba(233,195,101,.18) 0, transparent 40%),
      radial-gradient(circle at 85% 75%, rgba(233,195,101,.14) 0, transparent 42%);
    pointer-events:none;
  }
  .hero-inner{position:relative; max-width:520px; margin:0 auto;}
  .logo-plate{
    width:148px; height:148px; margin:0 auto 10px;
    border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #FFFFFF 0%, var(--cream) 70%);
    box-shadow: 0 12px 26px -8px rgba(0,0,0,.45), 0 0 0 5px rgba(255,255,255,.08);
    display:flex; align-items:center; justify-content:center;
    animation: badge-in .7s cubic-bezier(.2,.9,.25,1) both;
  }
  .logo-badge{
    width:122px; height:122px;
  }
  @keyframes badge-in{
    from{opacity:0; transform:translateY(-10px) scale(.9);}
    to{opacity:1; transform:translateY(0) scale(1);}
  }
  .brand-name{
    font-family:var(--font-display);
    font-weight:700;
    font-size:clamp(2.2rem, 9vw, 2.9rem);
    letter-spacing:.01em;
    margin:2px 0 2px;
    color:var(--white);
    animation: badge-in .7s .08s cubic-bezier(.2,.9,.25,1) both;
  }
  .tagline{
    margin:0 0 6px;
    color:var(--gold-400);
    font-weight:700;
    letter-spacing:.04em;
    font-size:.95rem;
    animation: badge-in .7s .14s cubic-bezier(.2,.9,.25,1) both;
  }
  .currency-note{
    margin:0 0 18px;
    color:rgba(255,255,255,.6);
    font-weight:500;
    font-size:.78rem;
    animation: badge-in .7s .17s cubic-bezier(.2,.9,.25,1) both;
  }
  .search-wrap{
    position:relative;
    animation: badge-in .7s .2s cubic-bezier(.2,.9,.25,1) both;
  }
  .search-wrap input{
    width:100%;
    padding:13px 46px 13px 44px;
    border-radius:999px;
    border:1.5px solid rgba(255,255,255,.16);
    background:rgba(255,255,255,.08);
    color:var(--white);
    font-family:var(--font-body);
    font-weight:500;
    font-size:.98rem;
  }
  .search-wrap input::placeholder{color:rgba(255,255,255,.55);}
  .search-wrap input:focus{
    background:rgba(255,255,255,.14);
    border-color:var(--gold-500);
  }
  .search-icon{
    position:absolute; top:50%; right:16px; transform:translateY(-50%);
    width:18px; height:18px; color:rgba(255,255,255,.6); pointer-events:none;
  }
  .clear-btn{
    position:absolute; top:50%; left:8px; transform:translateY(-50%);
    width:30px; height:30px; border-radius:50%; border:none;
    background:rgba(255,255,255,.14); color:var(--white);
    display:none; align-items:center; justify-content:center; cursor:pointer;
    font-size:1.1rem; line-height:1;
  }
  .clear-btn.show{display:flex;}
  .clear-btn:hover{background:rgba(255,255,255,.24);}

  /* ---------- CATEGORY NAV ---------- */
  .cat-nav{
    position:sticky; top:0; z-index:40;
    background:var(--cream);
    box-shadow:var(--shadow-1);
    height:var(--nav-h);
    display:flex; align-items:center;
  }
  .cat-nav-inner{
    display:flex; gap:8px;
    overflow-x:auto;
    padding:0 14px;
    scrollbar-width:none;
    -webkit-overflow-scrolling:touch;
  }
  .cat-nav-inner::-webkit-scrollbar{display:none;}
  .cat-pill{
    flex:0 0 auto;
    display:flex; align-items:center; gap:6px;
    padding:8px 15px;
    border-radius:999px;
    border:1.5px solid rgba(27,42,84,.14);
    background:var(--white);
    color:var(--navy-900);
    font-family:var(--font-body);
    font-weight:700;
    font-size:.87rem;
    cursor:pointer;
    white-space:nowrap;
    transition: background-color .22s ease, color .22s ease, border-color .22s ease, transform .15s ease;
  }
  .cat-pill svg{width:17px; height:17px; flex:0 0 auto;}
  .cat-pill:hover{border-color:var(--gold-500);}
  .cat-pill:active{transform:scale(.96);}
  .cat-pill.active{
    background:var(--navy-900);
    border-color:var(--navy-900);
    color:var(--gold-400);
  }

  /* ---------- MAIN / SECTIONS ---------- */
  main{max-width:640px; margin:0 auto; padding:22px 16px 10px;}

  .section{scroll-margin-top: calc(var(--nav-h) + 14px); margin-bottom:30px;}

  .ribbon{
    position:relative;
    display:inline-flex; align-items:center; gap:9px;
    background:linear-gradient(135deg, var(--navy-800), var(--navy-900));
    color:var(--gold-400);
    padding:.6rem 1.9rem;
    font-weight:800;
    font-size:1.05rem;
    clip-path: polygon(14px 0, 100% 0, 100% 100%, 14px 100%, 0 50%);
    margin-inline-start:-2px;
  }
  .ribbon svg{width:22px; height:22px; color:var(--gold-400); flex:0 0 auto;}
  .ribbon .count{
    font-weight:500; font-size:.78rem; color:rgba(233,195,101,.72);
    margin-inline-start:4px;
  }

  .item-list{list-style:none; margin:14px 0 0; padding:0;}
  .item{
    display:flex; align-items:center; gap:11px;
    padding:9px 4px;
    border-bottom:1px dashed rgba(27,42,84,.16);
    transition: background-color .18s ease;
    cursor:pointer;
    border-radius:10px;
  }
  .item:last-child{border-bottom:none;}
  .item:hover{background:var(--gold-100);}
  .item:active{background:var(--gold-100); transform:scale(.995);}
  .item-thumb{
    flex:0 0 auto;
    width:46px; height:46px;
    border-radius:12px;
    display:flex; align-items:center; justify-content:center;
    background: linear-gradient(150deg, var(--gold-100), #F3E0B8);
    box-shadow: inset 0 0 0 1px rgba(192,144,47,.25);
  }
  .item-thumb svg{width:22px; height:22px; color:var(--gold-600);}
  .item-thumb img{width:100%; height:100%; object-fit:cover; border-radius:12px;}
  .item-name{
    font-weight:600; font-size:1rem; color:var(--ink);
    flex:0 1 auto;
  }
  .item-leader{
    flex:1 1 auto;
    border-bottom:2px dotted rgba(27,42,84,.22);
    height:0; margin-bottom:5px;
    min-width:14px;
  }
  .item-price{
    flex:0 0 auto;
    font-weight:800; font-size:1rem;
    color:var(--gold-600);
    background:var(--gold-100);
    padding:3px 11px;
    border-radius:999px;
    white-space:nowrap;
  }
  .item-price .cur{
    font-size:.68rem; font-weight:700; opacity:.75;
  }
  .item.hidden{display:none;}
  .section.hidden{display:none;}

  /* ---------- EMPTY STATE ---------- */
  .empty-state{
    display:none;
    max-width:640px; margin:40px auto; padding:0 20px;
    text-align:center; color:var(--ink-soft);
  }
  .empty-state.show{display:block;}
  .empty-state svg{width:52px; height:52px; color:var(--gold-500); margin-bottom:10px;}
  .empty-state p{margin:0; font-weight:700; font-size:1.05rem; color:var(--navy-900);}
  .empty-state span{font-size:.9rem;}

  /* ---------- ITEM DETAIL MODAL ---------- */
  .item-modal-backdrop{
    position:fixed; inset:0;
    background:rgba(15,24,50,.55);
    opacity:0; visibility:hidden;
    transition: opacity .25s ease, visibility .25s ease;
    z-index:80;
  }
  .item-modal-backdrop.show{opacity:1; visibility:visible;}

  .item-modal{
    position:fixed; left:0; right:0; bottom:0;
    z-index:81;
    max-width:640px; margin:0 auto;
    background:var(--cream);
    border-radius:22px 22px 0 0;
    box-shadow: var(--shadow-2);
    transform: translateY(100%);
    transition: transform .32s cubic-bezier(.2,.85,.25,1);
    max-height:88vh;
    overflow-y:auto;
    padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 18px);
  }
  .item-modal.show{transform:translateY(0);}
  @media (prefers-reduced-motion: reduce){
    .item-modal, .item-modal-backdrop{transition:none;}
  }
  .item-modal-handle{
    width:38px; height:5px; border-radius:99px;
    background:rgba(27,42,84,.18);
    margin:10px auto 0;
  }
  .item-modal-close{
    position:absolute; top:14px; left:14px;
    width:34px; height:34px; border-radius:50%;
    background:rgba(255,255,255,.9);
    border:none; color:var(--navy-900);
    font-size:1.3rem; line-height:1;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; box-shadow:var(--shadow-1);
  }
  .item-modal-image{
    margin:16px 20px 0;
    aspect-ratio: 4 / 3;
    border-radius:16px;
    background: radial-gradient(120% 140% at 30% 20%, var(--gold-100) 0%, #F1DDAE 100%);
    display:flex; align-items:center; justify-content:center;
    overflow:hidden;
    position:relative;
  }
  .item-modal-image svg{width:64px; height:64px; color:var(--gold-600); opacity:.85;}
  .item-modal-image img{width:100%; height:100%; object-fit:cover;}
  .item-modal-image .photo-hint{
    position:absolute; bottom:8px; inset-inline:0;
    text-align:center; font-size:.72rem; font-weight:600;
    color:var(--gold-600); opacity:.75;
  }
  .item-modal-body{padding:16px 22px 4px;}
  .item-modal-name{
    margin:0 0 6px; font-family:var(--font-display);
    font-weight:700; font-size:1.4rem; color:var(--navy-900);
  }
  .item-modal-desc{
    margin:0 0 16px; color:var(--ink-soft);
    font-size:.95rem; line-height:1.6;
  }
  .item-modal-price{
    display:inline-flex; align-items:baseline; gap:4px;
    background:var(--gold-100); color:var(--gold-600);
    font-weight:800; font-size:1.15rem;
    padding:7px 18px; border-radius:999px;
  }
  .item-modal-price .cur{font-size:.75rem; font-weight:700; opacity:.8;}

  /* ---------- FOOTER ---------- */
  .site-footer{
    background:var(--navy-900);
    color:rgba(255,255,255,.75);
    text-align:center;
    padding:30px 20px 26px;
    margin-top:20px;
  }
  .footer-badge{
    font-family:var(--font-display);
    font-size:1.7rem; color:var(--gold-400); margin-bottom:4px;
  }
  .site-footer p{margin:0; font-size:.85rem; letter-spacing:.03em;}

  @media (min-width:700px){
    .item-name{font-size:1.05rem;}
    .ribbon{font-size:1.15rem;}
  }
</style>
</head>

const ICONS = {
  crepe:'i-crepe', waffle:'i-waffle', chocomo:'i-chocomo', milkshake:'i-milkshake',
  cocktail:'i-cocktail', juice:'i-juice', coffee:'i-coffee', soda:'i-soda',
  burger:'i-burger', snacks:'i-snacks', meal:'i-meal', star:'i-star'
};

function iconSvg(key, cls){
  var id = ICONS[key];
  return '<svg class="'+cls+'" aria-hidden="true"><use href="#'+id+'" xlink:href="#'+id+'"></use></svg>';
}

function renderNav(){
  const wrap = document.getElementById('catNavInner');
  let html = '';
  MENU.forEach(function(cat, i){
    html += '<button class="cat-pill' + (i===0?' active':'') + '" data-target="cat-' + cat.id + '" type="button">';
    html += iconSvg(cat.icon, '');
    html += '<span>' + cat.name + '</span>';
    html += '</button>';
  });
  wrap.innerHTML = html;
}

function renderSections(){
  const root = document.getElementById('menuRoot');
  let html = '';
  MENU.forEach(function(cat){
    html += '<section class="section" id="cat-' + cat.id + '" data-cat="' + cat.id + '">';
    html += '<div class="ribbon">' + iconSvg(cat.icon,'') + '<span>' + cat.name + '</span><span class="count" dir="ltr">(' + cat.items.length + ')</span></div>';
    html += '<ul class="item-list">';
    cat.items.forEach(function(it, idx){
      html += '<li class="item" data-name="' + it.name + '" data-cat="' + cat.id + '" data-idx="' + idx + '" role="button" tabindex="0">';
      html += '<span class="item-thumb">' + iconSvg(cat.icon,'') + '</span>';
      html += '<span class="item-name">' + it.name + '</span>';
      html += '<span class="item-leader"></span>';
      html += '<span class="item-price" dir="ltr">' + it.price + ' <span class="cur">ل.س</span></span>';
      html += '</li>';
    });
    html += '</ul></section>';
  });
  root.innerHTML = html;
}

function normalizeAr(s){
  return s
    .replace(/[إأآا]/g,'ا')
    .replace(/ى/g,'ي')
    .replace(/ة/g,'ه')
    .replace(/ؤ/g,'و')
    .replace(/ئ/g,'ي')
    .replace(/[\u064B-\u0652]/g,'')
    .toLowerCase()
    .trim();
}

function setupSearch(){
  const input = document.getElementById('searchInput');
  const clearBtn = document.getElementById('clearBtn');
  const emptyState = document.getElementById('emptyState');
  const sections = Array.from(document.querySelectorAll('.section'));

  function applyFilter(){
    const q = normalizeAr(input.value);
    clearBtn.classList.toggle('show', q.length>0);
    let anyVisible = false;

    sections.forEach(sec => {
      const items = Array.from(sec.querySelectorAll('.item'));
      let visibleInSection = 0;
      items.forEach(it => {
        const match = q==='' || normalizeAr(it.dataset.name).includes(q);
        it.classList.toggle('hidden', !match);
        if(match) visibleInSection++;
      });
      sec.classList.toggle('hidden', visibleInSection===0);
      if(visibleInSection>0) anyVisible = true;
    });

    emptyState.classList.toggle('show', !anyVisible);
  }

  input.addEventListener('input', applyFilter);
  clearBtn.addEventListener('click', () => {
    input.value='';
    applyFilter();
    input.focus();
  });
}

function setupNavClicks(){
  document.getElementById('catNavInner').addEventListener('click', (e) => {
    const btn = e.target.closest('.cat-pill');
    if(!btn) return;
    const input = document.getElementById('searchInput');
    if(input.value){ input.value=''; input.dispatchEvent(new Event('input')); }
    const target = document.getElementById(btn.dataset.target);
    if(target) target.scrollIntoView({behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block:'start'});
  });
}

function setupScrollspy(){
  const pills = Array.from(document.querySelectorAll('.cat-pill'));
  const sections = Array.from(document.querySelectorAll('.section'));
  const byId = {};
  pills.forEach(function(p){ byId[p.dataset.target] = p; });

  let debounceTimer = null;

  const observer = new IntersectionObserver(function(entries){
    entries.forEach(function(entry){
      if(entry.isIntersecting){
        const id = entry.target.id;
        const pill = byId[id];
        if(pill && !pill.classList.contains('active')){
          pills.forEach(function(p){ p.classList.remove('active'); });
          pill.classList.add('active');
          if(debounceTimer) clearTimeout(debounceTimer);
          debounceTimer = setTimeout(function(){
            pill.scrollIntoView({behavior:'smooth', inline:'center', block:'nearest'});
          }, 220);
        }
      }
    });
  }, { rootMargin: '-60px 0px -70% 0px', threshold: 0 });

  sections.forEach(function(s){ observer.observe(s); });
}

function findItem(catId, idx){
  for (var i=0; i<MENU.length; i++){
    if(MENU[i].id === catId) return { cat: MENU[i], item: MENU[i].items[idx] };
  }
  return null;
}

function setupItemModal(){
  const backdrop = document.getElementById('itemBackdrop');
  const modal = document.getElementById('itemModal');
  const closeBtn = document.getElementById('itemModalClose');
  const imgWrap = document.getElementById('itemModalImage');
  const nameEl = document.getElementById('itemModalName');
  const descEl = document.getElementById('itemModalDesc');
  const priceEl = document.getElementById('itemModalPrice');
  const menuRoot = document.getElementById('menuRoot');
  let lastFocused = null;

  function openModal(catId, idx){
    const found = findItem(catId, idx);
    if(!found) return;
    const cat = found.cat, item = found.item;

    nameEl.textContent = item.name;
    if(item.desc){
      descEl.textContent = item.desc;
      descEl.style.display = '';
    } else {
      descEl.style.display = 'none';
    }
    priceEl.setAttribute('dir','ltr');
    priceEl.innerHTML = item.price + ' <span class="cur">ل.س</span>';

    if(item.img){
      imgWrap.innerHTML = '<img src="' + item.img + '" alt="' + item.name + '">';
    } else {
      imgWrap.innerHTML = iconSvg(cat.icon,'') + '<span class="photo-hint">الصورة قريباً</span>';
    }

    lastFocused = document.activeElement;
    backdrop.classList.add('show');
    modal.classList.add('show');
    modal.setAttribute('aria-hidden','false');
    document.body.style.overflow = 'hidden';
    closeBtn.focus();
  }

  function closeModal(){
    backdrop.classList.remove('show');
    modal.classList.remove('show');
    modal.setAttribute('aria-hidden','true');
    document.body.style.overflow = '';
    if(lastFocused && lastFocused.focus) lastFocused.focus();
  }

  menuRoot.addEventListener('click', function(e){
    const row = e.target.closest('.item');
    if(!row) return;
    openModal(row.dataset.cat, parseInt(row.dataset.idx,10));
  });

  menuRoot.addEventListener('keydown', function(e){
    if(e.key==='Enter' || e.key===' '){
      const row = e.target.closest('.item');
      if(row){
        e.preventDefault();
        openModal(row.dataset.cat, parseInt(row.dataset.idx,10));
      }
    }
  });

  closeBtn.addEventListener('click', closeModal);
  backdrop.addEventListener('click', closeModal);
  document.addEventListener('keydown', function(e){
    if(e.key==='Escape' && modal.classList.contains('show')) closeModal();
  });
}

document.addEventListener('DOMContentLoaded', () => {
  renderNav();
  renderSections();
  setupSearch();
  setupNavClicks();
  setupScrollspy();
  setupItemModal();
});
</script>
</body>
